start_instance: &action
  target:
    device:
      integration: incus
    entity:
      integration: incus
  fields:
    instance:
      example: web
      selector:
        text:
    project:
      default: default
      example: default
      selector:
        text:
    config_entry:
      selector:
        config_entry:
          integration: incus
    force:
      default: false
      selector:
        boolean:
    timeout:
      default: 30
      selector:
        number:
          min: -1
          max: 3600
          unit_of_measurement: s
          mode: box
stop_instance: *action
restart_instance: *action
freeze_instance: *action
unfreeze_instance: *action
rescan_inventory:
  fields:
    config_entry:
      selector:
        config_entry:
          integration: incus
